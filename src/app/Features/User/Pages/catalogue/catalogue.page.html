<div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop pb-section-gap">
  <app-catalogue-search-and-categories></app-catalogue-search-and-categories>
  
  <div class="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-gutter mt-8">
    <div class="md:col-span-3">
      <app-catalogue-filter></app-catalogue-filter>
    </div>
    
    <div class="md:col-span-9">
      @if (store.isLoading()) {
        <div class="flex justify-center py-12">
          <p class="text-on-surface-variant">Loading books...</p>
        </div>
      } @else if (store.error()) {
        <div class="bg-error-container text-on-error-container p-4 rounded-xl">
          <p>{{ store.error() }}</p>
        </div>
      } @else {
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          @for (book of store.books(); track book.id) {
            <app-book-card [book]="book"></app-book-card>
          }
          @empty {
            <div class="col-span-full py-12 text-center text-on-surface-variant">
              <p>No books found.</p>
            </div>
          }
        </div>
        
        <app-pagination 
          [currentPage]="store.currentPage()"
          [totalPages]="store.totalPages()"
          (pageChange)="onPageChange($event)">
        </app-pagination>
      }
    </div>
  </div>
</div>
